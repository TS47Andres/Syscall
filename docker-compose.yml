services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  clamav:
    build:
      context: .
      dockerfile: docker/clamav/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep PONG"]
      interval: 20s
      timeout: 10s
      retries: 18

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/syscall
      REDIS_URL: redis://redis:6379
      SMTP_HOST: smtp
      CLAMAV_HOST: clamav
      ATTACHMENT_STORAGE_PATH: /var/lib/syscall/attachments
      RAW_MAIL_STORAGE_PATH: /var/lib/syscall/raw-mail
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - mail-storage:/var/lib/syscall
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      smtp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  voice-agent:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: docker/voice-agent/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:3000
      VOICE_AGENT_PORT: 4000
    ports:
      - "127.0.0.1:${VOICE_AGENT_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  smtp:
    build:
      context: .
      dockerfile: docker/smtp/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/syscall
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      ATTACHMENT_STORAGE_PATH: /var/lib/syscall/attachments
      RAW_MAIL_STORAGE_PATH: /var/lib/syscall/raw-mail
    expose:
      - "2525"
    volumes:
      - mail-storage:/var/lib/syscall
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'); const s=net.connect(2525,'127.0.0.1',()=>{s.end();process.exit(0)}); s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/syscall
      REDIS_URL: redis://redis:6379
      SMTP_HOST: smtp
      CLAMAV_HOST: clamav
      ATTACHMENT_STORAGE_PATH: /var/lib/syscall/attachments
      RAW_MAIL_STORAGE_PATH: /var/lib/syscall/raw-mail
    volumes:
      - mail-storage:/var/lib/syscall
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      smtp:
        condition: service_healthy

volumes:
  mongodb-data:
  redis-data:
  mail-storage:
